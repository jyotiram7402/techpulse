name: Keep scheduled workflows alive (weekly)

# GitHub auto-disables scheduled workflows in public repos after 60 days
# without a commit. That silently stopped all ingestion once (and Supabase
# then paused from inactivity). Re-enabling the workflows through the API
# resets the 60-day countdown — no dummy commits needed.

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch: {}

permissions:
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Re-enable scheduled workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Leaves alone any workflow that was disabled on purpose.
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows" \
            --jq '.workflows[]
                  | select(.path | startswith(".github/workflows/"))
                  | select(.state != "disabled_manually")
                  | "\(.id)\t\(.state)\t\(.name)"' |
          while IFS=$'\t' read -r id state name; do
            gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${id}/enable"
            echo "Enabled: ${name} (was ${state})"
          done
